<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .t { font-size: 13px; fill: #c9d1d9; }
      .dim { fill: #7d8590; }
      .cmd { fill: #79c0ff; font-weight: 600; }
      .ok { fill: #3fb950; }
      .bad { fill: #f85149; }
      .hash { fill: #a371f7; }
      .fresh { fill: #3fb950; }
      .owner { fill: #d29922; }
      .bullet { fill: #58a6ff; }
      .cross { fill: #f85149; font-weight: 700; }
      @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
      .cursor { animation: blink 1.1s step-end infinite; }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect width="960" height="430" rx="10" fill="url(#bg)" stroke="#30363d"/>

  <!-- title bar -->
  <rect width="960" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="960" height="10" fill="#161b22"/>
  <line x1="0" y1="34" x2="960" y2="34" stroke="#30363d"/>
  <circle cx="22" cy="17" r="6" fill="#f85149"/>
  <circle cx="42" cy="17" r="6" fill="#d29922"/>
  <circle cx="62" cy="17" r="6" fill="#3fb950"/>
  <text x="480" y="22" text-anchor="middle" font-size="11" fill="#7d8590">context-forge — node examples/pack.js</text>

  <!-- command -->
  <text x="24" y="68" class="t"><tspan class="cmd">$</tspan> <tspan fill="#e6edf3">node examples/pack.js</tspan><tspan class="cursor" fill="#3fb950"> ▊</tspan></text>

  <!-- header -->
  <text x="24" y="104" class="t" font-weight="600" fill="#e6edf3">Context Forge — knowledge pack example</text>

  <!-- step 1 -->
  <text x="24" y="136" class="t">1) FOLDER data/knowledge <tspan class="dim">(isti tok kao u produkciji)</tspan></text>
  <text x="38" y="160" class="t"><tspan fill="#e6edf3">izvora 5</tspan> <tspan class="dim">→</tspan> <tspan class="ok" font-weight="600">chunkova 2</tspan> <tspan class="dim">·</tspan> <tspan fill="#e6edf3">izbačeno 3</tspan></text>

  <!-- accepted -->
  <text x="38" y="190" class="t"><tspan class="bullet">•</tspan> anonimni.md#1                  <tspan class="fresh">svežina 1.00 (fresh)</tspan> <tspan class="dim">· vlasnik —</tspan>      <tspan class="hash">sha256:a2132e6c…</tspan></text>
  <text x="38" y="212" class="t"><tspan class="bullet">•</tspan> policy_2026.md#1               <tspan class="fresh">svežina 0.97 (fresh)</tspan> <tspan class="dim">· vlasnik</tspan> <tspan class="owner">finansije</tspan> <tspan class="hash">sha256:f01d82df…</tspan></text>

  <!-- rejected -->
  <text x="38" y="242" class="t"><tspan class="cross">✗</tspan> cenovnik_2023.md               <tspan class="bad">isteklo: 1368.5 dana / TTL 180</tspan></text>
  <text x="38" y="264" class="t"><tspan class="cross">✗</tspan> kupci_pii.md                   <tspan class="bad">osetljivo: PII u izvoru</tspan> <tspan class="dim">(email, iban, jmbg, kartica, telefon)</tspan></text>

  <!-- footer -->
  <line x1="24" y1="296" x2="936" y2="296" stroke="#21262d"/>
  <text x="24" y="322" class="t dim">Svaki chunk nosi <tspan fill="#e6edf3">izvor · vlasnik · datum · SHA-256</tspan> — odgovor se može vratiti do tačnog dokumenta.</text>
  <text x="24" y="344" class="t dim">Zastarjelo se <tspan fill="#f85149">odbija</tspan> (TTL), lični podaci se <tspan fill="#f85149">blokiraju</tspan> prije modela.</text>
  <text x="24" y="378" class="t dim">Zavisnosti: <tspan class="ok" font-weight="600">0</tspan> · Testovi: <tspan class="ok" font-weight="600">50 / 50</tspan> · Vrijeme: <tspan class="ok" font-weight="600">0.15 s</tspan> · Bez interneta</text>
  <text x="24" y="404" class="t"><tspan class="cmd">$</tspan> <tspan class="cursor" fill="#3fb950">▊</tspan></text>
</svg>
